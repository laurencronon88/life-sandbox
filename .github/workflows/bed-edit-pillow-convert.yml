name: Bed Edit pillow review JPEG to production WebP

on:
  push:
    branches:
      - bed-edit/pillow-corrections
    paths:
      - 'the-bed-edit/assets/pillow-corrections-review/**'
      - '.github/workflows/bed-edit-pillow-convert.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Convert reviewed images to the 18 existing WebP paths
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('the-bed-edit/assets')
          review=root/'pillow-corrections-review'
          source=sorted(review.glob('*.jpg'))
          assert len(source)==18, f'Expected 18 retouched images, found {len(source)}'
          for path in source:
              target=root/(path.stem+'.webp')
              assert target.exists(), f'Existing manifest target missing: {target}'
              with Image.open(path) as im:
                  assert im.size==(829,840), (path, im.size)
                  im.convert('RGB').save(target, format='WEBP', quality=88, method=6)
                  print(f'{path.name} -> {target.name} ({target.stat().st_size} bytes)')
          assert len(list(root.glob('*.webp')))==18
          PY
      - name: Commit converted files to correction branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the-bed-edit/assets/*.webp
          if git diff --cached --quiet; then
            echo 'No WebP differences'
          else
            git commit -m "Retouch 18 production WebP pillow images for issue #6 [skip ci]"
            git push origin HEAD:bed-edit/pillow-corrections
          fi
