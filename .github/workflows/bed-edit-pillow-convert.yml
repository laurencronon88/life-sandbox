name: Convert Bed Edit pillow review assets to WebP
on:
  push:
    branches: [bed-edit/pillow-corrections]
    paths:
      - '.github/workflows/bed-edit-pillow-convert.yml'
      - 'the-bed-edit/assets/pillow-corrections-review/**'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install WebP image encoder
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Convert all 18 reviewed candidate photographs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('the-bed-edit/assets')
          previews=sorted((root/'pillow-corrections-review').glob('*.jpg'))
          assert len(previews)==18, f"Expected 18 previews; got {len(previews)}"
          for path in previews:
              target=root/(path.stem+'.webp')
              assert target.is_file(), f"Original image missing: {target}"
              with Image.open(path) as im:
                  assert im.width>750 and im.height>750, f"Low-res: {path}: {im.size}"
                  im.convert('RGB').save(target,'WEBP',quality=88,method=6)
                  check=Image.open(target)
                  assert check.format=='WEBP' and check.size==im.size
                  print(target, im.size, target.stat().st_size)
          assert len(list(root.glob('*.webp')))==18
          PY
      - name: Commit final WebPs to correction branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add the-bed-edit/assets/*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Finish 18 corrected WebP photographs for #6 [skip ci]'
            git push origin HEAD:bed-edit/pillow-corrections
          fi
