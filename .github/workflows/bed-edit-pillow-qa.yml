name: Bed Edit corrected photography browser QA
on:
  push:
    branches: [bed-edit/pillow-corrections]
    paths:
      - '.github/workflows/bed-edit-pillow-qa.yml'
      - 'the-bed-edit/image-manifest.js'
      - 'the-bed-edit/assets/*.webp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve Bed Edit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bed-edit-server.log 2>&1 &
          sleep 2
      - name: Verify summer/winter, angles, product budgets, mobile/tablet/desktop
        run: node the-bed-edit/tests/browser-qa.cjs
      - name: Upload responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bed-edit-pillow-correction-qa
          path: qa-*.png
          if-no-files-found: ignore
