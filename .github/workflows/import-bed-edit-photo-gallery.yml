name: Import Bed Edit PDF photos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-bed-edit-photo-gallery.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download the eight exact extracted PDF images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p the-bed-edit/signature/photos
          download() {
            local name="$1"
            local url="$2"
            local out="the-bed-edit/signature/photos/$name"
            curl -fLsS --retry 3 --connect-timeout 15 --max-time 90 "$url" -o "$out"
            case "$(file -b --mime-type "$out")" in image/jpeg|image/png|image/webp) ;; *) echo "Invalid image for $name" >&2; exit 1;; esac
            test "$(stat -c '%s' "$out")" -gt 8000
          }
          download "pearl-hero.jpg" "https://at.adobe.com/ggvkX0m1ScGcd8sK"
          download "pearl-without-quilt.jpg" "https://at.adobe.com/a4z8niVKvpZrrtau"
          download "pearl-quilt-spread.jpg" "https://at.adobe.com/LGAJpKlSl549P2ZZ"
          download "pearl-quilt-folded.jpg" "https://at.adobe.com/UgCin45mRh1F2KjA"
          download "dune-hero.jpg" "https://at.adobe.com/ZdPjV8CFnIjZ10VF"
          download "dune-without-quilt.jpg" "https://at.adobe.com/VKF57IpU3lwKFrLA"
          download "dune-quilt-spread.jpg" "https://at.adobe.com/cAkMotceNk49aJ1W"
          download "dune-quilt-folded.jpg" "https://at.adobe.com/ZH706jefySwerX0K"
      - name: Commit permanent JPG images to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the-bed-edit/signature/photos/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add eight Pearl and Dune photos extracted from comparison PDF"
            git push origin HEAD:main
          fi
