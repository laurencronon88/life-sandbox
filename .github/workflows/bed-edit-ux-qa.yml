name: Bed Edit browser QA
on:
  push:
    branches: [main]
    paths:
      - 'the-bed-edit/**'
      - '.github/workflows/bed-edit-ux-qa.yml'
  pull_request:
    paths:
      - 'the-bed-edit/**'
      - '.github/workflows/bed-edit-ux-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bed-edit-server.log 2>&1 &
          sleep 2
      - name: Page flow, prices and layout at phone, tablet and desktop
        run: node the-bed-edit/tests/browser-qa.cjs
      - name: All 18 photos, every look, season and angle
        run: node the-bed-edit/tests/pillow-qa.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bed-edit-qa-screenshots
          path: qa-*.png
          if-no-files-found: ignore
