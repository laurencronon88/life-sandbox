name: Import corrected Bed Edit photography
on:
  push:
    branches: [bed-edit/mobile-clarity-ivory]
    paths:
      - .github/workflows/import-bed-edit-photos.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bed-edit/mobile-clarity-ivory
          persist-credentials: true
      - name: Fetch and validate approved photography package
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --max-time 90 "https://at.adobe.com/9OPo1hgo2VseEBXJ" -o /tmp/bed-edit-photos.zip
          echo "808a26494ffbd2cd2770f75fb564acb94e847d32433c3f4891b2bc51c3440423  /tmp/bed-edit-photos.zip" | sha256sum -c -
          test "$(unzip -Z1 /tmp/bed-edit-photos.zip | grep -Ec '^the-bed-edit/assets/(crisp-classic|soft-textured|airy-luminous)-(summer|winter)-(hero|side|detail)\.webp$')" -eq 18
          unzip -o /tmp/bed-edit-photos.zip 'the-bed-edit/assets/*.webp'
          test "$(find the-bed-edit/assets -maxdepth 1 -name '*.webp' | wc -l)" -ge 18
      - name: Commit corrected imagery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the-bed-edit/assets/
          if ! git diff --cached --quiet; then
            git commit -m "Replace 18 Bed Edit photos with corrected styling"
            git push origin HEAD:bed-edit/mobile-clarity-ivory
          fi
